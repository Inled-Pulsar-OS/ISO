name: Deploy Website to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to pull for the site content'
        required: false
        default: 'main'
      edition:
        description: 'Edition to treat as default (bittenfruit, tube-os, wintux)'
        required: false
        default: 'bittenfruit'
      version:
        description: 'Version tag (short, without edition suffix)'
        required: false
        default: '0.4-beta'
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy public/ to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate site from committed manifests
        run: |
          python3 generate-manifest.py \
            --version "${{ github.event.inputs.version || '0.4-beta' }}" \
            --edition "${{ github.event.inputs.edition || 'bittenfruit' }}" \
            --output-json public/releases.json \
            --html-dir public
          cp -f configs/SHA256SUMS public/SHA256SUMS
          rm -rf ISO
          ls -la public/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=pulsaros-releases --branch=main --commit-dirty=true
