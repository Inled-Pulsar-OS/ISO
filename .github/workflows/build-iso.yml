name: 🌌 Build & Publish Pulsar OS ISO & Internet Recovery

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version Tag'
        required: true
        default: '0.3-beta-bittenfruit'
      base:
        description: 'Base distribution (arch or debian)'
        required: true
        default: 'arch'
        type: choice
        options:
          - arch
          - debian
      bootloader:
        description: 'Bootloader (grub or refind)'
        required: true
        default: 'grub'
        type: choice
        options:
          - grub
          - refind

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools rsync curl jq

      - name: 🚀 Build Pulsar OS ISO & Recovery SquashFS
        env:
          VERSION: ${{ github.event.inputs.version || '0.3-beta-bittenfruit' }}
          BASE: ${{ github.event.inputs.base || 'arch' }}
          BOOTLOADER: ${{ github.event.inputs.bootloader || 'grub' }}
        run: |
          echo "Building Pulsar OS for $BASE with $BOOTLOADER (Version: $VERSION)..."
          # Run build script
          sudo ./ISO/build-iso.sh --base "$BASE" --bootloader "$BOOTLOADER" --version "$VERSION" || true

      - name: ☁️ Upload ISO and SquashFS to SourceForge
        env:
          SF_USER: ${{ secrets.SF_USER || secrets.SOURCEFORGE_USER }}
          SF_KEY: ${{ secrets.SF_SSH_KEY || secrets.SOURCEFORGE_SSH_KEY }}
          VERSION: ${{ github.event.inputs.version || '0.3-beta-bittenfruit' }}
        run: |
          if [ -n "$SF_USER" ] && [ -n "$SF_KEY" ]; then
            echo "Uploading artifacts to SourceForge..."
            mkdir -p ~/.ssh
            echo "$SF_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null || true
            # rsync -avP ISO/build/*.iso ISO/build/*.squashfs "${SF_USER}@frs.sourceforge.net:/home/frs/project/pulsaros-inled/"
          else
            echo "⚠️ SOURCEFORGE credentials not set; skipping upload in test mode."
          fi

      - name: 📝 Update Manifest & Build Static Web
        env:
          VERSION: ${{ github.event.inputs.version || '0.3-beta-bittenfruit' }}
          BASE: ${{ github.event.inputs.base || 'arch' }}
          BOOTLOADER: ${{ github.event.inputs.bootloader || 'grub' }}
        run: |
          mkdir -p public
          python3 ./ISO/generate-manifest.py \
            --version "$VERSION" \
            --base "$BASE" \
            --bootloader "$BOOTLOADER" \
            --output-json public/releases.json \
            --html-dir public \
            --set-latest
          cp ISO/configs/releases.json public/releases.json 2>/dev/null || true

      - name: ⚡ Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=pulsaros-releases --commit-dirty=true

      - name: 📢 Notify Webhook on Completion
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK || secrets.WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ github.event.inputs.version || '0.3-beta-bittenfruit' }}
          BASE: ${{ github.event.inputs.base || 'arch' }}
          BOOTLOADER: ${{ github.event.inputs.bootloader || 'grub' }}
        run: |
          SQUASHFS_URL="https://downloads.sourceforge.net/project/pulsaros-inled/pulsaros-${VERSION}-${BASE}-${BOOTLOADER}-${VERSION}.squashfs"
          ISO_URL="https://downloads.sourceforge.net/project/pulsaros-inled/pulsaros-${VERSION}-${BASE}-${BOOTLOADER}-${VERSION}.iso"
          ./ISO/notify-webhook.sh "$VERSION" "$BASE" "$BOOTLOADER" "$SQUASHFS_URL" "$ISO_URL" "${{ job.status }}"
