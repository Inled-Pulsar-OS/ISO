name: Notify Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'ISO version'
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          VERSION="${RELEASE_NAME:-$INPUT_VERSION}"
          if [ -n "$VERSION" ]; then
            ESCAPED=$(echo "$VERSION" | sed 's/"/\\"/g')
            MSG=$(echo -e "💿 **New ISO available!**\nVersion: \`${ESCAPED}\`\n<https://github.com/Inled-Pulsar-OS/ISO/releases/latest>")
          else
            MSG=$(echo -e "💿 **New ISO available!**\n<https://github.com/Inled-Pulsar-OS/ISO/releases/latest>")
          fi
          jq -n --arg msg "$MSG" '{"content": $msg}' | \
            curl -s -X POST "$DISCORD_WEBHOOK" -H "Content-Type: application/json" -d @-
